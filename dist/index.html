    <style>
:root {
  --paper: #f4f1e8;
  --paper-deep: #e7e1d3;
  --ink: #181917;
  --muted: #65655f;
  --line: #c9c3b6;
  --signal: #e84a2a;
  --signal-dark: #b92d13;
  --steel: #263238;
  --white: #fffdf8;
  --max-width: 1180px;
  --mono: "DM Mono", monospace;
  --sans: "Manrope", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(rgba(24, 25, 23, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(24, 25, 23, 0.035) 1px, transparent 1px);
  background-size: 32px 32px;
  font-family: var(--sans);
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

.site-header {
  width: min(calc(100% - 40px), var(--max-width));
  min-height: 64px;
  margin: 0 auto;
  border-bottom: 1px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.brand-mark {
  position: relative;
  width: 28px;
  height: 28px;
  border: 2px solid var(--ink);
  display: grid;
  place-items: center;
  transform: rotate(45deg);
  background: var(--signal);
}

.brand-mark span {
  width: 10px;
  height: 10px;
  border: 2px solid var(--ink);
  background: var(--paper);
}

.brand strong {
  display: block;
  letter-spacing: 0;
}

.brand strong {
  font-size: 0.9rem;
}

#header-links {
  display: flex;
  align-items: center;
  gap: 18px;
}

#header-links a,
footer a {
  font: 0.76rem var(--mono);
  text-underline-offset: 4px;
}

main,
footer {
  width: min(calc(100% - 40px), var(--max-width));
  margin-inline: auto;
}

.intro {
  padding: 32px 0;
  border-bottom: 1px solid var(--ink);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 480px);
  align-items: center;
  gap: 48px;
}

h3,
p {
  letter-spacing: 0;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.7;
}

.subtitle span {
  display: block;
}

.catalog {
  padding: 24px 0 96px;
}

.intro-search {
  display: flex;
  align-items: center;
  gap: 16px;
}

.search-field {
  position: relative;
  width: min(100%, 480px);
}

.search-field input {
  width: 100%;
  height: 48px;
  padding: 0 16px 0 46px;
  border: 1px solid var(--ink);
  border-radius: 0;
  color: var(--ink);
  background: var(--white);
  font: 0.9rem var(--sans);
}

.search-field input::placeholder {
  color: var(--muted);
}

.search-field input:focus {
  outline: 3px solid var(--signal);
  outline-offset: 3px;
}

.search-icon {
  position: absolute;
  z-index: 1;
  top: 15px;
  left: 16px;
  width: 15px;
  height: 15px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  pointer-events: none;
}

.search-icon::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 2px;
  right: -6px;
  bottom: -3px;
  background: var(--ink);
  transform: rotate(45deg);
}

.catalog-count {
  margin: 0;
  color: var(--muted);
  font: 0.75rem var(--mono);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.no-results {
  margin: 0;
  padding: 40px 16px;
  border-block: 1px solid var(--ink);
  color: var(--muted);
  text-align: center;
}

.tool {
  border-top: 1px solid var(--ink);
}

.tool:last-child {
  border-bottom: 1px solid var(--ink);
}

.tool-header,
.platform-header {
  position: relative;
}

.tool-toggle,
.platform-toggle {
  width: 100%;
  border: 0;
  color: inherit;
  background: transparent;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.tool-toggle {
  min-height: 88px;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(180px, 0.8fr) minmax(260px, 1.2fr) auto;
  align-items: center;
  gap: 28px;
  transition: background-color 180ms ease;
}

.tool-toggle[aria-expanded="false"] {
  min-height: 64px;
  padding-block: 10px;
}

.tool-toggle:hover,
.tool-toggle:focus-visible {
  background: rgba(255, 253, 248, 0.72);
}

.tool-title-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.tool-title-row h3 {
  margin: 0;
  font-size: 1.35rem;
}

.version,
.badge {
  font: 0.68rem var(--mono);
}

.version {
  color: var(--signal-dark);
}

.tool-description {
  margin: 0;
  color: var(--muted);
  line-height: 1.55;
}

.tool-repo-link,
.platform-repo-link {
  position: absolute;
  z-index: 2;
  right: 68px;
  top: 50%;
  color: var(--signal-dark);
  font: 0.68rem var(--mono);
  text-underline-offset: 4px;
  transform: translateY(-50%);
}

.tool-header:has(.tool-repo-link) .tool-description {
  padding-right: 72px;
}

.tool-toggle[aria-expanded="false"] + .tool-repo-link {
  visibility: hidden;
  pointer-events: none;
}

.chevron {
  width: 36px;
  height: 36px;
  border: 1px solid var(--ink);
  display: grid;
  place-items: center;
  font-size: 1rem;
  transition: transform 220ms ease, background-color 180ms ease, color 180ms ease;
}

[aria-expanded="true"] > .chevron,
[aria-expanded="true"] .chevron {
  color: var(--white);
  background: var(--ink);
  transform: rotate(180deg);
}

.collapsible {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 260ms ease;
}

.collapsible.is-open {
  grid-template-rows: 1fr;
}

.collapsible:not(.is-open) .collapsible-inner {
  visibility: hidden;
}

.collapsible-inner {
  min-height: 0;
  overflow: hidden;
}

.tool-body-inner {
  padding: 0 16px 28px;
}

.platform {
  border-top: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.52);
}

.platform:last-child {
  border-bottom: 1px solid var(--line);
}

.platform-toggle {
  min-height: 66px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: minmax(110px, 0.4fr) 1fr auto;
  align-items: center;
  gap: 20px;
}

.platform-toggle:hover,
.platform-toggle:focus-visible {
  background: var(--white);
}

.platform-name {
  font-weight: 700;
}

.badge {
  width: fit-content;
  padding: 5px 8px;
  color: var(--muted);
  border: 1px solid var(--line);
}

.platform-toggle .chevron {
  width: 28px;
  height: 28px;
  font-size: 0.78rem;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  background: var(--white);
}

th,
td {
  padding: 17px 16px;
  border-top: 1px solid var(--line);
  vertical-align: middle;
}

th {
  color: var(--muted);
  font: 500 0.67rem var(--mono);
  text-align: left;
  text-transform: uppercase;
}

td {
  font-size: 0.86rem;
  line-height: 1.5;
}

th:nth-child(1),
td:nth-child(1) {
  width: 30%;
}

th:nth-child(2),
td:nth-child(2) {
  width: 43%;
  color: var(--muted);
}

th:last-child,
td:last-child {
  text-align: right;
}

.download-link {
  display: inline-flex;
  min-height: 40px;
  padding: 10px 14px;
  align-items: center;
  justify-content: center;
  color: var(--white);
  background: var(--signal-dark);
  border: 1px solid var(--signal-dark);
  font: 500 0.7rem var(--mono);
  text-decoration: none;
  transition: background-color 160ms ease, transform 160ms ease;
}

.download-link:hover,
.download-link:focus-visible {
  background: var(--ink);
  border-color: var(--ink);
  transform: translateY(-2px);
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--signal);
  outline-offset: 3px;
}

footer {
  min-height: 100px;
  padding: 24px 0;
  border-top: 1px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  color: var(--muted);
  font-size: 0.8rem;
}

@media (max-width: 760px) {
  .site-header {
    min-height: 60px;
  }

  #header-links a:not(:first-child) {
    display: none;
  }

  .intro {
    padding: 24px 0;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .catalog {
    padding: 28px 0 72px;
  }

  .intro-search {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }

  .tool-toggle {
    min-height: 0;
    padding: 10px 4px;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
  }

  .tool-description {
    grid-column: 1 / -1;
    grid-row: 2;
    font-size: 0.85rem;
    line-height: 1.35;
  }

  .tool-header:has(.tool-repo-link) .tool-description {
    padding-right: 0;
  }

  .tool-header:has(.tool-repo-link) .tool-toggle[aria-expanded="true"] {
    width: calc(100% - 68px);
  }

  .tool-repo-link {
    right: 4px;
    top: auto;
    bottom: 12px;
    transform: none;
  }

  .tool-toggle[aria-expanded="false"] .tool-description {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tool-toggle > .chevron {
    grid-column: 2;
    grid-row: 1;
  }

  .tool-body-inner {
    padding-inline: 4px;
  }

  .platform-toggle {
    grid-template-columns: 1fr auto;
    gap: 8px;
  }

  .badge {
    grid-column: 1;
    grid-row: 2;
  }

  .platform-toggle .chevron {
    grid-column: 2;
    grid-row: 1 / 3;
  }

  .platform-repo-link {
    right: 48px;
    top: auto;
    bottom: 17px;
    transform: none;
  }

  footer {
    align-items: start;
    flex-direction: column;
    justify-content: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}

function createExternalLink(label, url, className = "") {
  const link = document.createElement("a");
  link.href = url;
  link.textContent = label;
  link.className = className;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function createPackageTable(packages, platformName) {
  const wrapper = document.createElement("div");
  wrapper.className = "table-wrap";

  const table = document.createElement("table");
  const caption = document.createElement("caption");
  caption.textContent = `${platformName} package downloads`;
  caption.hidden = true;
  table.append(caption);

  const head = document.createElement("thead");
  const headerRow = document.createElement("tr");
  ["Type", "System requirements", "Download link"].forEach((heading) => {
    const cell = document.createElement("th");
    cell.scope = "col";
    cell.textContent = heading;
    headerRow.append(cell);
  });
  head.append(headerRow);
  table.append(head);

  const body = document.createElement("tbody");
  packages.forEach((packageVariant) => {
    const row = document.createElement("tr");
    const typeCell = document.createElement("td");
    const requirementsCell = document.createElement("td");
    const downloadCell = document.createElement("td");

    typeCell.textContent = packageVariant.type;
    requirementsCell.textContent = packageVariant.systemRequirements;
    downloadCell.append(createExternalLink(packageVariant.linkText, packageVariant.downloadUrl, "download-link"));
    row.append(typeCell, requirementsCell, downloadCell);
    body.append(row);
  });
  table.append(body);
  wrapper.append(table);
  return wrapper;
}

function createPlatform(platform, toolId, platformIndex, openByDefault, showPlatformRepo) {
  const platformId = `${toolId}-platform-${platformIndex}`;
  const section = document.createElement("section");
  section.className = "platform";

  const header = document.createElement("div");
  header.className = "platform-header";

  const toggle = document.createElement("button");
  toggle.className = "platform-toggle";
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", String(openByDefault));
  toggle.setAttribute("aria-controls", platformId);

  const name = document.createElement("span");
  name.className = "platform-name";
  name.textContent = platform.platformName;
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = platform.badge;
  const chevron = document.createElement("span");
  chevron.className = "chevron";
  chevron.setAttribute("aria-hidden", "true");
  chevron.textContent = "⌄";
  toggle.append(name, badge, chevron);

  header.append(toggle);
  if (showPlatformRepo && platform.repoUrl) {
    header.append(createExternalLink("Source ↗", platform.repoUrl, "platform-repo-link"));
  }

  const panel = document.createElement("div");
  panel.id = platformId;
  panel.className = `collapsible${openByDefault ? " is-open" : ""}`;
  const inner = document.createElement("div");
  inner.className = "collapsible-inner";
  inner.append(createPackageTable(platform.packages, platform.platformName));
  panel.append(inner);

  toggle.addEventListener("click", () => togglePanel(toggle, panel));
  section.append(header, panel);
  return section;
}

function createTool(tool, openByDefault) {
  const panelId = `${tool.id}-details`;
  const article = document.createElement("article");
  article.className = "tool";

  const header = document.createElement("div");
  header.className = "tool-header";

  const toggle = document.createElement("button");
  toggle.className = "tool-toggle";
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", String(openByDefault));
  toggle.setAttribute("aria-controls", panelId);

  const titleRow = document.createElement("span");
  titleRow.className = "tool-title-row";
  const title = document.createElement("h3");
  title.textContent = tool.name;
  const version = document.createElement("span");
  version.className = "version";
  version.textContent = tool.version;
  titleRow.append(title, version);

  const description = document.createElement("span");
  description.className = "tool-description";
  description.textContent = tool.description;
  const chevron = document.createElement("span");
  chevron.className = "chevron";
  chevron.setAttribute("aria-hidden", "true");
  chevron.textContent = "⌄";
  toggle.append(titleRow, description, chevron);

  header.append(toggle);
  if (tool.repoUrl) {
    header.append(createExternalLink("Source ↗", tool.repoUrl, "tool-repo-link"));
  }

  const panel = document.createElement("div");
  panel.id = panelId;
  panel.className = `collapsible${openByDefault ? " is-open" : ""}`;
  const inner = document.createElement("div");
  inner.className = "collapsible-inner tool-body-inner";
  tool.platforms.forEach((platform, platformIndex) => {
    inner.append(createPlatform(platform, tool.id, platformIndex, tool.platforms.length === 1, !tool.repoUrl));
  });
  panel.append(inner);

  toggle.addEventListener("click", () => togglePanel(toggle, panel));
  article.append(header, panel);
  return article;
}

function togglePanel(toggle, panel) {
  const isOpen = toggle.getAttribute("aria-expanded") === "true";
  toggle.setAttribute("aria-expanded", String(!isOpen));
  panel.setAttribute("aria-hidden", String(isOpen));
  panel.inert = isOpen;
  panel.classList.toggle("is-open", !isOpen);
}

function setInitialPanelState(panel, isOpen) {
  panel.setAttribute("aria-hidden", String(!isOpen));
  panel.inert = !isOpen;
}

function setupToolSearch(tools) {
  const search = document.getElementById("tool-search");
  const count = document.getElementById("catalog-count");
  const noResults = document.getElementById("no-results");
  const toolElements = Array.from(document.querySelectorAll(".tool"));

  search.addEventListener("input", () => {
    const query = search.value.trim().toLowerCase();
    let visibleCount = 0;

    tools.forEach((tool, index) => {
      const searchableText = [
        tool.name,
        tool.version,
        tool.description,
        ...tool.platforms.map((platform) => platform.platformName)
      ].join(" ").toLowerCase();
      const matches = searchableText.includes(query);
      toolElements[index].hidden = !matches;
      visibleCount += Number(matches);
    });

    count.textContent = `${visibleCount} ${visibleCount === 1 ? "tool" : "tools"} available`;
    noResults.hidden = visibleCount !== 0;
  });
}

function renderSite() {
  const { site, tools } = directoryData;
  document.getElementById("brand-name").textContent = site.name;
  const subtitle = document.getElementById("site-subtitle");
  site.subtitleLines.forEach((line) => {
    const lineElement = document.createElement("span");
    lineElement.textContent = line;
    subtitle.append(lineElement);
  });
  document.getElementById("catalog-count").textContent = `${tools.length} ${tools.length === 1 ? "tool" : "tools"} available`;
  document.getElementById("footer-copy").textContent = site.footerText;

  const headerLinks = document.getElementById("header-links");
  site.links.forEach(({ label, url }) => headerLinks.append(createExternalLink(`${label} ↗`, url)));

  const footerLink = document.getElementById("footer-link");
  footerLink.textContent = `${site.footerLinkText} ↗`;
  footerLink.href = site.footerLinkUrl;
  footerLink.target = "_blank";
  footerLink.rel = "noopener noreferrer";

  const directory = document.getElementById("tools-directory");
  tools.forEach((tool) => directory.append(createTool(tool, tools.length === 1)));
  directory.querySelectorAll(".collapsible").forEach((panel) => {
    setInitialPanelState(panel, panel.classList.contains("is-open"));
  });
  setupToolSearch(tools);
}

renderSite();
    </script>
  </body>
</html>
